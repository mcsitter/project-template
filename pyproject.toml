[project]
name = "project_template"
version = "0.1.0"
description = "A Python package that does things."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
types = []
dev = [
  { include-group = "types" },
  "copier",
  "prek",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
extend-exclude = [
  "*{{*}}*",
  "*{%*%}*",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D203",
  "D213",
  "S311",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
