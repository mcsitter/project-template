default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

ci:
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: requirements-txt-fixer
      - id: check-ast

  - repo: https://github.com/mcsitter/pre-commit-hooks
    rev: v0.0.2
    hooks:
      - id: ruff-rule-links
      - id: sentence-per-line

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.5.1
    hooks:
      # Tombi fetches the SchemaStore catalog on every run, which fails in
      # sandboxes without network. Offline mode skips the fetch; formatting is
      # unaffected, only SchemaStore-backed validation is.
      - id: tombi-format
        args: [--offline]
        exclude: ^uv\.lock$
      - id: tombi-lint
        args: [--offline]
        exclude: ^uv\.lock$

  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.9
    hooks:
      - id: biome-format
        args:
          - "--indent-style=space"

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.1
    hooks:
      - id: commitizen
        stages: [commit-msg]
      - id: commitizen-branch
        stages: [pre-push]
